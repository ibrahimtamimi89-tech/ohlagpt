<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OHLA GPT</title>
  <style>
    body { font-family: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; margin:0; background:#f6f7f9; }
    header { background:#0b2545; color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 6px rgba(0,0,0,.1); }
    header .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:20px; }
    header img { height:40px; border-radius:8px; }
    .container { max-width:1100px; margin:24px auto; padding:0 16px; display:grid; grid-template-columns:1fr 260px; gap:18px; }
    .card { background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.06); padding:18px; position:relative; }
    .chat { height:560px; display:flex; flex-direction:column; overflow:hidden; }
    .chat::before { content:""; position:absolute; inset:0; background:url('/static/logo.png') center/60% no-repeat; opacity:.6; pointer-events:none; }
    .messages { flex:1; overflow:auto; padding:8px; position:relative; z-index:1; }
    .msg { background:#f9fafb; border-radius:12px; padding:10px 12px; margin:6px 0; }
    .msg.me { background:#e0f2fe; }
    .composer { display:flex; gap:8px; position:relative; z-index:1; }
    input { width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:10px; font-size:15px; }
    .btn { padding:10px 14px; border:0; border-radius:10px; background:#2563eb; color:#fff; cursor:pointer; }
    .btn:hover { background:#1d4ed8; }
    .side { display:flex; flex-direction:column; gap:12px; justify-content:space-between; }
    .clock { background:#111827; color:#d1d5db; border-radius:12px; padding:16px; text-align:center; font-variant-numeric:tabular-nums; }
    .clock .time { font-size:28px; font-weight:600; color:#fff; }
    .clock .date { font-size:14px; opacity:.9; margin-top:4px; }
    .credit { text-align:center; font-size:16px; line-height:1.4; color:#374151; margin-top:12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/static/logo.png" alt="OHLA GPT Logo"/>
      <span>OHLA GPT — I-5 Project Assistant</span>
    </div>
  </header>

  <div class="container">
    <div class="card chat">
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="question" placeholder="Ask about the I-5 project files..." autocomplete="off" />
        <button class="btn" id="sendBtn">Send</button>
      </div>
    </div>

    <div class="side">
      <div class="card clock">
        <div class="time" id="clockTime">--:--:--</div>
        <div class="date" id="clockDate">----</div>
      </div>
      <div class="credit card">
        <div>Designed by: <b>Ibrahim Altamimi</b></div>
        <div>OHLA USA, Inc., I-5 Project – California</div>
      </div>
    </div>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
