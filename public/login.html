<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OHLA GPT — Login</title>
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#0b2545; color:white; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .box { background:white; color:#111; padding:36px 28px; border-radius:12px; width:320px; box-shadow:0 8px 30px rgba(0,0,0,.25); text-align:center; }
    h2 { margin:0 0 10px; }
    p  { margin:0 0 18px; color:#6b7280; font-size:14px; }
    input { width:100%; padding:10px; margin:8px 0 12px; border:1px solid #d1d5db; border-radius:8px; font-size:16px; }
    button { width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .error { color:#dc2626; min-height:22px; margin-top:8px; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔒 OHLA GPT</h2>
    <p>Enter password to continue</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Login</button>
    <div id="msg" class="error"></div>
  </div>

  <script>
    async function doLogin() {
      const pw = document.getElementById('pw').value.trim();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      if (res.ok) {
        location.href = '/';
      } else {
        document.getElementById('msg').textContent = 'Invalid password.';
      }
    }
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
