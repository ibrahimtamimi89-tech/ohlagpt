<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OHLA GPT – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: #020617;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      width: 340px;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.4);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      color: #f9fafb;
    }
    p {
      margin: 0 0 18px;
      font-size: 14px;
      color: #9ca3af;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      outline: none;
      margin-bottom: 14px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .error {
      color: #f97316;
      font-size: 13px;
      margin-top: 6px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>OHLA GPT</h1>
    <p>I-5 Project Assistant – Secure Access</p>
    <input id="pwd" type="password" placeholder="Enter access password" />
    <button id="loginBtn">Enter</button>
    <div id="error" class="error"></div>
  </div>

  <script>
    const pwdEl = document.getElementById('pwd');
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('error');

    async function doLogin() {
      const password = pwdEl.value.trim();
      if (!password) return;
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Checking...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          errEl.textContent = data.error || 'Invalid password';
          btn.disabled = false;
          btn.textContent = 'Enter';
          return;
        }
        window.location.href = '/';
      } catch (e) {
        errEl.textContent = 'Login failed. Try again.';
        btn.disabled = false;
        btn.textContent = 'Enter';
      }
    }

    btn.onclick = doLogin;
    pwdEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
